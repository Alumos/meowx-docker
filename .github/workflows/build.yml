name: build

# 只做 amd64，跑在 GitHub 的 ubuntu-latest（原生 x86，不用 qemu / buildx 多架构）。
# 推 main：测试 + 构建镜像，推 ghcr.io/alumos/meowx-docker:edge。
# 打 tag（v*，要与仓库根目录 VERSION 一致）：再推 :<版本> 与 :latest，并发 GitHub Release（附离线镜像包、docker-compose.yaml）。
# 手动触发：同推 main。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  IMAGE: ghcr.io/alumos/meowx-docker

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # 发 Release
      packages: write   # 推 GHCR
    env:
      MEOWX_CACHE: ${{ github.workspace }}/.cache
      GEO_REFRESH: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: version
        id: version
        run: |
          base=$(tr -d ' \n' < VERSION)
          core=$(sed -n 's/^CORE_REF="${CORE_REF:-\(.*\)}"$/\1/p' scripts/build-core.sh)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$base" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} 与 VERSION ${base} 不一致"
              exit 1
            fi
            version="$base"
          else
            version="${base}-edge.$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "构建 ${version}，内核 meowx-core ${core}"

      - name: test
        run: |
          cd agent
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::有文件没 gofmt"; exit 1; }
          go vet ./...
          go test ./...

      # 内核源码（按固定提交）与 tailscale 安装包：缓存起来，下次不用重新拉
      - uses: actions/cache@v4
        with:
          path: |
            .cache/meowx-core
            .cache/tailscale_*.tgz
          key: core-${{ steps.version.outputs.core }}-${{ hashFiles('scripts/fetch-tailscale.sh') }}
          restore-keys: core-

      - name: rootfs
        run: scripts/build-rootfs.sh "${{ steps.version.outputs.version }}"

      - name: image
        run: |
          docker build -t "$IMAGE:${{ steps.version.outputs.version }}" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version=${{ steps.version.outputs.version }} \
            --label org.opencontainers.image.licenses=GPL-3.0 \
            docker
          docker run --rm --entrypoint /usr/bin/meowx-core "$IMAGE:${{ steps.version.outputs.version }}" -v
          docker run --rm --entrypoint /usr/bin/tailscale "$IMAGE:${{ steps.version.outputs.version }}" version
          docker images "$IMAGE"

      - name: push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          v="${{ steps.version.outputs.version }}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tags="$v latest"
          else
            tags="$v edge"
          fi
          for t in $tags; do
            docker tag "$IMAGE:$v" "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done

      - name: offline package
        if: github.ref_type == 'tag'
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p dist
          docker tag "$IMAGE:$v" "$IMAGE:latest"
          docker save "$IMAGE:$v" "$IMAGE:latest" | gzip -9 > "dist/meowx-docker-$v-amd64.tar.gz"
          cp docker/docker-compose.yaml dist/
          (cd dist && sha256sum * | tee SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
